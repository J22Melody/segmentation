# Conda environment for the segment-any-sign project.
#
# Rebuild with:
#   module load miniforge3
#   conda env create -f environment.yml
#   conda activate sas
#
# This is the env for **the latest model** (2026) as well as for dataset
# curation and scoring. Only the 2023 model gets an env of its own
# (`environment-2023.yml`), because its pose-format 0.3.2 pin cannot coexist
# with the >=0.8.1 the 2026 model needs.
#
# Python 3.11 matches the sign_language_segmentation requirement (>=3.11).
# Note 3.14 does not work: pose estimation needs mediapipe's removed legacy
# Holistic API.
name: sas
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyterlab
  - ipykernel
  - jupytext
  - nbconvert
  - matplotlib
  - pandas
  - pip:
      - pympi-ling
      # segmentation metrics + their tests
      - scikit-learn
      - pytest
      # reading video frames (NCSLGR .mov) for annotation visualisation
      - imageio
      - imageio-ffmpeg
      # the 2026 model, its preprocessing and the shipped dist/2026 weights.
      # Installed from the checkout one level up, so a local edit to the model
      # code is picked up without reinstalling.
      - -e ..
      - numpy<2
      # reading the DGS TFDS build — the same source the 2023 benchmark reads,
      # so both models are scored on identical input poses.
      - tensorflow-cpu
      - tensorflow-datasets
      - sign-language-datasets
